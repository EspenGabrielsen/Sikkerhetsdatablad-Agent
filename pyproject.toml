[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sikkerhetsdatablad-agent"
version = "1.0.0"
description = "Extract Section 14 (Transport Information) and revision dates from Safety Data Sheet (SDS) PDFs using LLMs."
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
dependencies = [
    "pdfplumber",
    "openai>=1.30.0",
    "pydantic>=2.0",
    "pandas",
    "openpyxl",
    "python-dotenv",
    "requests",
    "tqdm",
]

[project.scripts]
sds-agent = "sikkerhetsdatablad_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sikkerhetsdatablad_agent*"]
